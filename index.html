<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>French AI poem generator</title>
</head>
<body>
    <div class="container">
<header> 
    <h1 class="heading"> French AI poem generator</h1>
</header>
<main>
    <div class="container-form">
        <form class="box" id="poem-generator-form">
            <input type="text"
            placeholder="Enter the topic of your poem."
            autofocus
            required
            autocomplete="off" 
            class="prompt-form"
            id="user-instructions"/>

            <input type="submit" class="submit-button"/>
        </form>
     <div class="hint"> e.g. flowers, stars or even breakfast</div>
    </div>
    <div class="poem-display" id="poem">
    </div>
</main>

<footer>This AI project was coded by 
    <a href="https://github.com/justnini98-source" target="blank">Vanessa</a> 
    and is open-sourced on 
        <a href="https://github.com/justnini98-source/French-Poem-Generator" target="blank"> Github </a> 
        and hosted on 
        <a href="https://french-poem-generator-x8hn.onrender.com/" target="blank">Render</a>.</footer>
    </div>
    <script src="src/code.js"></script>
</body>
</html>
